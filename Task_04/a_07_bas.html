<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <!-- GROUP TOGETHER HTML  -->
     <!-- <span> inline container to group elements for styling or functionality -->
    <!-- <div> block container to group elements for styling or functionality purposes -->

     

    <h1><span style="background-color:red;">This is a span title</span></h1>
    <h1><div style="background-color:blue;">This is a div title</div></h1>

    <p><span style="background-color: crimson;">this is a span sentence.</span></p>
    <p><div style="background-color: cyan;"> this is a span sentence.</div></p>

    
</body>
</html>
