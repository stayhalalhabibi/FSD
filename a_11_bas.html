<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">username:</label>

        <input type="text" id="username" name="Username" placeholder="mujahid" minlength="6" maxlength="25" required>
        <br>
        <label for="password">password</label>
        <input type="password" id="password" name="password" required><br> 

        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Stayhalalhabibi002@gmail.com"><br>

        <label for="phone">phone #:</label>
        <input 
            type="tel"
            id="phone" 
            name="phone"
            placeholder="123-456-7890" 
            oninput="this.value = this.value.replace(/[^0-9\-]/g, '')"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            title="Format: 123-456-7890"
            required>
            <br>
        <label for="birthday">Birthday:</label> 
        <input type="date" id="birthday" name="birthday" required><br>   
        
        <label for="title"></label>
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" name="title" value="mr" required>
        <label for="Ms">Ms.</label>
        <input type="radio" id="Ms" name="title" value="ms" required>      
        <label for="PhD.">Phd.</label>
        <input type="radio" id="PhD." value="PhD." name="title">     
        <br>

        <label for="payment">payment</label>
         <select id="payment" name="payment">
            <option value=""> Select Payment Method</option>
            <option value="Paypal">paypal</option>
            <option value="Visa">visa</option>  
            <option value="Mastercard">master card</option>
            <option value="Giftcard">Giftcard</option>
         </select></br>

        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="100" required><br>

        <br>
        <label for="subscribe">subscribe</label>
        <input type="checkbox" id="subscribe" name="subscribe"><br>

        <label for="comment">comment:</label>
        <textarea id="comment" name="comment" rows="3" cols="25"></textarea><br>
        
        <label for="file">File:</label>
        <input type="file" id="file" name="file" accept ="image/png, image/jpeg" required><br>

        <input type="reset">
        <br> <input type="submit">
        

    </form>
</body>
</html>
