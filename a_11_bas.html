<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="index.php" method="POST">

        <label for="username">Username:</label>

        <input type="text" id="username" placeholder="Spongebob" minlength="6" maxlength="25" required>

        <br>
        <label for="password">password</label>
        <input type="password" id="password" name="password" required><br> 

        <br>

        <label for="Email">Email</label>
        <input type="email" id="Email" name="Email" placeholder="Stayhalalhabibi002@gmail.com"><br>

        <label for="phone">phone #:</label>
        <input 
            type="tel"
            id="phone" 
            name="phone"
            placeholder="123-456-7890" 
            oninput="this.value = this.value.replace(/[^0-9\-]/g, '')"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            title="Format: 123-456-7890"
            required>

            <br>
        <label for="b.day">Birthday:</label> 
        <input type="date" id="b.day" name="b.day" required><br>   
        

        <label for="title"></label>
        
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" name="title" value="mr" required>
        <label for="Ms">Ms.</label>
        <input type="radio" id="Ms" name="title" value="ms" required>           

        <br>
        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="100" required><br>

        


        <input type="reset">
        <br>
        
        <input type="submit">
        
    </form>
</body>
</html>
