<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration</h1>
    <hr>

    <form>

        <label>Name:</label><br><br>
        <input type="text" size="50"><br><br><br>

        <label>Email:</label><br><br>
        <input type="email" size="50"><br><br><br>

        <label>Course:</label><br><br>

        <input type="radio" name="course">
        <label>HTML</label><br><br>

        <input type="radio" name="course">
        <label>CSS</label><br><br>

        <input type="radio" name="course">
        <label>JavaScript</label><br><br><br>

        <label>Gender:</label><br><br>

        <input type="radio" name="gender">
        <label>Male</label><br><br>

        <input type="radio" name="gender">
        <label>Female</label><br><br><br>

        <label>Date of Birth:</label><br><br>
        <input type="date"><br><br><br>

        <label>Mobile Number:</label><br><br>
        <input type="tel" placeholder="Enter mobile number"><br><br><br>

        <label>Department:</label><br><br>

        <select>
            <option>Select Department</option>
            <option>CSE</option>
            <option>AI & DS</option>
            <option>IT</option>
            <option>ECE</option>
        </select>

        <br><br><br>

        <label>Comments:</label><br><br>

        <textarea rows="6" cols="45"></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br><br>
    <hr>

</body>
</html>
